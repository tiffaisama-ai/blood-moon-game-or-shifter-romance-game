<head>

<style>
/* Blood Moon Shifters - Paranormal Romance Game */
:root {
    --color-void: #0a0a0f;
    --color-night: #12121a;
    --color-shadow: #1a1a2e;
    --color-dusk: #252542;
    --color-twilight: #3d3d6b;
    --color-mystic: #6b4c9a;
    --color-amethyst: #9b59b6;
    --color-orchid: #c77dff;
    --color-blood: #8b0000;
    --color-crimson: #dc143c;
    --color-rose: #ff6b9d;
    --color-moonlight: #e8e8ff;
    --text-primary: #f0e6ff;
    --text-secondary: #b8a9c9;
    --text-muted: #7a6b8a;
    --font-display: 'Cinzel', serif;
    --font-body: 'Crimson Text', Georgia, serif;
    --space-xs: 0.25rem;
    --space-sm: 0.5rem;
    --space-md: 1rem;
    --space-lg: 2rem;
    --space-xl: 3rem;
    --transition-fast: 0.2s ease;
    --transition-medium: 0.4s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
    font-family: var(--font-body);
    background: var(--color-void);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.7;
}
body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background:
        radial-gradient(ellipse at 20% 20%, rgba(107, 76, 154, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(139, 0, 0, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 0%, rgba(155, 89, 182, 0.08) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
}
#particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
.particle {
    position: absolute;
    width: 4px; height: 4px;
    background: var(--color-orchid);
    border-radius: 50%;
    opacity: 0;
    animation: float-up 8s infinite;
    box-shadow: 0 0 10px var(--color-amethyst);
}
@keyframes float-up {
    0% { opacity: 0; transform: translateY(100vh) scale(0); }
    10%, 90% { opacity: 0.6; }
    100% { opacity: 0; transform: translateY(-100px) scale(1); }
}
#moon-glow {
    position: fixed;
    top: -150px; right: -150px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(232, 232, 255, 0.15) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
    animation: moon-pulse 6s ease-in-out infinite;
}
@keyframes moon-pulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.1); opacity: 1; }
}
#game-container { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; }
.screen { display: none; min-height: 100vh; padding: var(--space-md); }
.screen.active { display: flex; flex-direction: column; animation: fadeIn 0.5s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
#title-screen { justify-content: center; align-items: center; text-align: center; }
.title-content { max-width: 600px; padding: var(--space-xl); }
.moon-icon {
    font-size: 5rem;
    margin-bottom: var(--space-lg);
    animation: moon-float 4s ease-in-out infinite;
    filter: drop-shadow(0 0 30px rgba(232, 232, 255, 0.5));
}
@keyframes moon-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}
.game-title {
    font-family: var(--font-display);
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    font-weight: 700;
    color: var(--text-primary);
    text-shadow: 0 0 20px var(--color-amethyst), 0 0 40px rgba(155, 89, 182, 0.5), 0 0 80px rgba(139, 0, 0, 0.3);
    margin-bottom: var(--space-md);
    letter-spacing: 0.1em;
}
.tagline {
    font-style: italic;
    font-size: 1.3rem;
    color: var(--text-secondary);
    margin-bottom: var(--space-xl);
}
.title-buttons { display: flex; flex-direction: column; gap: var(--space-md); align-items: center; }
.btn {
    font-family: var(--font-display);
    font-size: 1.1rem;
    padding: var(--space-md) var(--space-xl);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: all var(--transition-medium);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    min-width: 220px;
}
.btn-primary {
    background: linear-gradient(135deg, var(--color-mystic) 0%, var(--color-amethyst) 100%);
    color: var(--text-primary);
    box-shadow: 0 4px 20px rgba(155, 89, 182, 0.4);
}
.btn-primary:hover {
    background: linear-gradient(135deg, var(--color-amethyst) 0%, var(--color-orchid) 100%);
    transform: translateY(-2px);
}
.btn-secondary {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--color-twilight);
}
.btn-secondary:hover { background: var(--color-shadow); color: var(--text-primary); }
.btn-danger {
    background: linear-gradient(135deg, var(--color-blood) 0%, var(--color-crimson) 100%);
    color: var(--text-primary);
}
.btn-small {
    font-family: var(--font-display);
    font-size: 0.8rem;
    padding: var(--space-sm) var(--space-md);
    background: var(--color-shadow);
    color: var(--text-secondary);
    border: 1px solid var(--color-twilight);
    border-radius: 4px;
    cursor: pointer;
}
.btn-icon, .btn-icon-small {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 1.5rem;
    padding: var(--space-sm);
    opacity: 0.7;
}
.btn-icon:hover, .btn-icon-small:hover { opacity: 1; transform: scale(1.1); }
.btn-icon-small { font-size: 1.2rem; }
.sound-toggle-container { margin-top: var(--space-xl); }
#game-screen { padding: 0; }
#game-hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--space-md) var(--space-lg);
    background: linear-gradient(180deg, rgba(10, 10, 15, 0.95) 0%, transparent 100%);
    position: sticky;
    top: 0;
    z-index: 100;
}
.hud-left, .hud-right { display: flex; align-items: center; gap: var(--space-md); }
#romance-meter { display: flex; align-items: center; gap: var(--space-sm); }
.meter-label {
    font-family: var(--font-display);
    font-size: 0.85rem;
    color: var(--color-orchid);
    text-transform: uppercase;
}
.meter-bar {
    width: 120px; height: 8px;
    background: var(--color-shadow);
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--color-twilight);
}
.meter-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--color-mystic) 0%, var(--color-rose) 100%);
    transition: width var(--transition-medium);
    box-shadow: 0 0 10px var(--color-rose);
}
#romance-value { font-family: var(--font-display); font-size: 0.9rem; color: var(--color-rose); min-width: 30px; }
#scene-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 900px;
    margin: 0 auto;
    padding: var(--space-lg);
    width: 100%;
}
#character-area { display: flex; justify-content: center; margin-bottom: var(--space-lg); min-height: 200px; }
#character-portrait { transition: all var(--transition-medium); }
#character-portrait.hidden { opacity: 0; transform: translateY(20px); }
.portrait-frame {
    position: relative;
    width: 280px; height: 320px;
    background: linear-gradient(180deg, var(--color-shadow) 0%, var(--color-night) 100%);
    border: 2px solid var(--color-twilight);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 60px rgba(107, 76, 154, 0.2);
}
#character-image {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
}
.character-silhouette {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--color-dusk) 0%, var(--color-shadow) 100%);
}
.character-silhouette::before {
    content: '';
    width: 120px; height: 200px;
    background: linear-gradient(180deg, var(--color-night) 0%, var(--color-void) 50%, var(--color-night) 100%);
    mask-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 166"><ellipse cx="50" cy="25" rx="20" ry="25"/><path d="M25 50 Q15 80 20 120 L35 166 L65 166 L80 120 Q85 80 75 50 Q65 45 50 45 Q35 45 25 50Z"/></svg>');
    -webkit-mask-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 166"><ellipse cx="50" cy="25" rx="20" ry="25"/><path d="M25 50 Q15 80 20 120 L35 166 L65 166 L80 120 Q85 80 75 50 Q65 45 50 45 Q35 45 25 50Z"/></svg>');
    mask-size: contain; -webkit-mask-size: contain;
    mask-repeat: no-repeat; -webkit-mask-repeat: no-repeat;
    filter: drop-shadow(0 0 20px var(--color-amethyst));
}
#character-name-badge {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: var(--space-sm) var(--space-md);
    background: linear-gradient(0deg, rgba(10, 10, 15, 0.95) 0%, transparent 100%);
    font-family: var(--font-display);
    font-size: 1rem;
    text-align: center;
    color: var(--color-orchid);
    text-transform: uppercase;
}
#story-area { flex: 1; margin-bottom: var(--space-lg); }
#location-badge {
    display: inline-block;
    font-family: var(--font-display);
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    padding: var(--space-xs) var(--space-md);
    background: var(--color-shadow);
    border: 1px solid var(--color-twilight);
    margin-bottom: var(--space-md);
}
#story-text {
    font-size: 1.15rem;
    line-height: 1.9;
    padding: var(--space-lg);
    background: linear-gradient(135deg, rgba(26, 26, 46, 0.6) 0%, rgba(18, 18, 26, 0.8) 100%);
    border-left: 3px solid var(--color-mystic);
    border-radius: 0 8px 8px 0;
}
#story-text .emphasis { color: var(--color-orchid); font-style: italic; }
#story-text .dialogue { color: var(--color-moonlight); font-weight: 600; }
#story-text .internal { color: var(--text-secondary); font-style: italic; }
#choices-area { display: flex; flex-direction: column; gap: var(--space-md); margin-top: auto; }
.choice-btn {
    font-family: var(--font-body);
    font-size: 1.05rem;
    padding: var(--space-md) var(--space-lg);
    background: linear-gradient(135deg, var(--color-shadow) 0%, var(--color-night) 100%);
    color: var(--text-primary);
    border: 1px solid var(--color-twilight);
    border-radius: 6px;
    cursor: pointer;
    transition: all var(--transition-medium);
    text-align: left;
}
.choice-btn:hover {
    border-color: var(--color-amethyst);
    transform: translateX(8px);
    box-shadow: 0 4px 20px rgba(155, 89, 182, 0.3);
}
.choice-btn .romance-hint { margin-left: var(--space-sm); font-size: 0.85rem; color: var(--color-rose); }
#notification {
    position: fixed;
    top: 80px; left: 50%;
    transform: translateX(-50%);
    padding: var(--space-md) var(--space-lg);
    background: linear-gradient(135deg, var(--color-mystic) 0%, var(--color-amethyst) 100%);
    border-radius: 6px;
    font-family: var(--font-display);
    font-size: 0.95rem;
    text-transform: uppercase;
    z-index: 200;
}
#notification.hidden { display: none; }
#ending-screen { justify-content: center; align-items: center; text-align: center; }
.ending-content {
    max-width: 600px;
    padding: var(--space-xl);
    background: linear-gradient(135deg, rgba(26, 26, 46, 0.8) 0%, rgba(18, 18, 26, 0.9) 100%);
    border-radius: 12px;
    border: 1px solid var(--color-twilight);
}
#ending-icon { font-size: 4rem; margin-bottom: var(--space-lg); }
#ending-title {
    font-family: var(--font-display);
    font-size: clamp(1.8rem, 5vw, 2.5rem);
    color: var(--color-orchid);
    margin-bottom: var(--space-lg);
}
#ending-text { font-size: 1.1rem; line-height: 1.8; color: var(--text-secondary); margin-bottom: var(--space-xl); }
#ending-text p { margin-bottom: 1em; }
#ending-text em { color: var(--color-orchid); }
.ending-stats {
    padding: var(--space-lg);
    background: var(--color-shadow);
    border-radius: 8px;
    margin-bottom: var(--space-xl);
}
.ending-stats p { font-family: var(--font-display); font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: var(--space-sm); }
.ending-stats span { color: var(--color-orchid); font-weight: 600; }
.ending-buttons { display: flex; flex-direction: column; gap: var(--space-md); align-items: center; }
.overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(10, 10, 15, 0.95);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 500;
}
.overlay.hidden { display: none; }
.overlay-content {
    text-align: center;
    padding: var(--space-xl);
    background: linear-gradient(135deg, var(--color-shadow) 0%, var(--color-night) 100%);
    border: 1px solid var(--color-twilight);
    border-radius: 12px;
}
.overlay-content h2 {
    font-family: var(--font-display);
    font-size: 2rem;
    color: var(--color-orchid);
    margin-bottom: var(--space-xl);
    text-transform: uppercase;
}
.overlay-content .btn { display: block; width: 100%; margin-bottom: var(--space-md); }
.save-popup {
    position: fixed;
    bottom: var(--space-lg); right: var(--space-lg);
    padding: var(--space-md) var(--space-lg);
    background: linear-gradient(135deg, var(--color-mystic) 0%, var(--color-amethyst) 100%);
    border-radius: 6px;
    font-family: var(--font-display);
    z-index: 300;
}
.save-popup.hidden { display: none; }
@media (max-width: 768px) {
    :root { font-size: 14px; }
    #game-hud { padding: var(--space-sm) var(--space-md); flex-wrap: wrap; gap: var(--space-sm); }
    .meter-bar { width: 80px; }
    #scene-container { padding: var(--space-md); }
    .portrait-frame { width: 220px; height: 260px; }
    #story-text { font-size: 1rem; padding: var(--space-md); }
    .choice-btn { font-size: 0.95rem; padding: var(--space-md); }
    #moon-glow { width: 250px; height: 250px; top: -100px; right: -100px; }
    .moon-icon { font-size: 3.5rem; }
}
@media (max-width: 480px) {
    #game-hud { justify-content: center; }
    .hud-left, .hud-right { width: 100%; justify-content: center; }
    #character-area { min-height: 150px; }
    .portrait-frame { width: 180px; height: 220px; }
}
@media (hover: none) {
    .choice-btn:hover { transform: none; box-shadow: none; }
    .choice-btn:active { border-color: var(--color-amethyst); }
}
</style>
</head>

<script>
const GameState={currentScene:'intro',romancePoints:0,maxRomance:100,choicesMade:[],flags:{},soundEnabled:true};
const StoryContent={
intro:{location:"Ravenshollow - Town Limits",showCharacter:false,text:`The GPS died three miles back, and now your car sputters to a halt on a road you're certain wasn't on any map.

<span class="internal">Just my luck...</span>

Fog curls between ancient pine trees, thick as smoke. The moon hangs low—impossibly large, tinged with red at its edges. A <span class="emphasis">blood moon</span>, they call it.

Your grandmother's letter crinkles in your pocket. The inheritance that brought you here. A house in a town called <span class="emphasis">Ravenshollow</span>—a place your family never mentioned.

Through the mist, you spot a figure. Tall. Unnaturally still. Watching.`,choices:[{text:"Call out to them for help",nextScene:"first_meeting_friendly",romanceChange:5,hint:"💜"},{text:"Stay in the car and lock the doors",nextScene:"first_meeting_cautious",romanceChange:0},{text:"Get out and approach them slowly",nextScene:"first_meeting_bold",romanceChange:10,hint:"💜💜"}]},
first_meeting_friendly:{location:"The Misty Road",showCharacter:true,characterName:"???",text:`<span class="dialogue">"Hello? I'm sorry to bother you, but my car broke down!"</span>

The figure moves—no, <span class="emphasis">glides</span>—through the fog toward you. As they emerge, your breath catches.

He's beautiful in a way that doesn't seem entirely human. Sharp cheekbones, silver-grey eyes that seem to glow faintly in the moonlight, dark hair falling across his forehead.

<span class="dialogue">"You shouldn't be here."</span> He stops just outside arm's reach. <span class="dialogue">"Not tonight. Not during the blood moon."</span>

<span class="internal">There's something in his gaze—warning, yes, but also... curiosity?</span>

<span class="dialogue">"Let me help you. But we need to move. Now."</span>`,choices:[{text:'"Why? What happens during the blood moon?"',nextScene:"questioning",romanceChange:5,hint:"💜"},{text:'"I can take care of myself."',nextScene:"defiant",romanceChange:0},{text:"Take his offered hand without hesitation",nextScene:"trusting",romanceChange:15,hint:"💜💜"}]},
first_meeting_cautious:{location:"Inside Your Car",showCharacter:true,characterName:"???",text:`You slam the locks down, heart pounding. The figure tilts their head—an oddly inhuman gesture—then moves toward your car with fluid grace.

A knock on your window. You nearly scream.

<span class="dialogue">"I'm not going to hurt you."</span> The voice is deep, resonant. <span class="dialogue">"But staying in that vehicle won't protect you from what's coming."</span>

Through the foggy glass, you make out his features: impossibly handsome, with eyes that seem to catch the moonlight and reflect it back like a wolf's.

<span class="dialogue">"The blood moon is rising. You need to trust me, or you won't survive the night."</span>

<span class="internal">Every instinct screams that he's dangerous. But somehow... you also sense he's telling the truth.</span>`,choices:[{text:"Roll down the window just a crack to talk",nextScene:"questioning",romanceChange:5,hint:"💜"},{text:"Demand he prove he's not a threat",nextScene:"defiant",romanceChange:0},{text:"Something in his eyes makes you unlock the door",nextScene:"trusting",romanceChange:10,hint:"💜💜"}]},
first_meeting_bold:{location:"The Misty Road",showCharacter:true,characterName:"???",text:`You step out of the car, chin raised. If something's going to happen, you'd rather face it head-on.

The stranger's eyes widen slightly—<span class="emphasis">surprise? Respect?</span>—as you walk toward him through the fog.

Up close, he's devastating. Tall enough that you have to crane your neck, with features that belong on a Renaissance sculpture. His silver eyes rake over you, and you feel heat bloom in your chest.

<span class="dialogue">"Brave."</span> A ghost of a smile touches his lips. <span class="dialogue">"Or foolish. I haven't decided yet."</span>

<span class="dialogue">"My car died,"</span> you say, keeping your voice steady. <span class="dialogue">"And you're the only person I've seen in miles."</span>

questioning:{location:"The Edge of the Forest",showCharacter:true,characterName:"Kael",text:`He studies you for a long moment, then seems to make a decision.

<span class="dialogue">"My name is Kael."</span> He gestures toward the forest. <span class="dialogue">"And this land... it belongs to my kind. Shifters."</span>

<span class="internal">Shifters? As in...</span>

<span class="dialogue">"The blood moon awakens the old magic,"</span> he continues. <span class="dialogue">"Makes us... harder to control. There are those in my pack who would see you as prey."</span>

defiant:{location:"The Misty Road",showCharacter:true,characterName:"Kael",text:`His jaw tightens at your words, but there's something like respect in his gaze.

<span class="internal">The authority in his voice makes something primal in you want to obey.</span>`,choices:[{text:"Run with him without argument",nextScene:"journey_begin",romanceChange:10,hint:"💜"},{text:'"Tell me what\'s hunting us!"',nextScene:"the_hunters",romanceChange:5}]},
trusting:{location:"The Moonlit Path",showCharacter:true,characterName:"Kael",text:`Something shifts in his expression—softens—as you show him your trust. His fingers close around yours, and warmth spreads up your arm.

<span class="dialogue">"I am Kael."</span> His thumb brushes across your knuckles, almost absently. <span class="dialogue">"And you are either the bravest human I've ever met... or the most foolish."</span>

<span class="dialogue">"My pack. They've caught your scent."</span> His free hand cups your cheek, tilting your face up to meet his glowing eyes. <span class="dialogue">"I'm going to keep you safe. Do you believe me?"</span>

<span class="internal">His touch sends electricity through your veins. You've never felt so seen.</span>

<span class="dialogue">"I believe you,"</span> you whisper.`,choices:[{text:"Ask why he would protect a stranger",nextScene:"grandmother_secret",romanceChange:15,hint:"💜💜"},{text:"Let him lead you into the darkness",nextScene:"journey_begin",romanceChange:20,hint:"💜💜💜"}]},
grandmother_secret:{location:"Moving Through the Forest",showCharacter:true,characterName:"Kael",text:`Kael's grip tightens on your hand as he guides you through the fog-wrapped trees.

<span class="dialogue">"Your grandmother..."</span> He pauses, silver eyes distant. <span class="dialogue">"She was special to my pack. To me. She had the gift—the ability to sense the supernatural, to walk between worlds."</span>

He glances at you, something vulnerable in his gaze.

<span class="dialogue">"She was also the only human I ever trusted. When she left Ravenshollow, she made me promise to protect her bloodline."</span>

<span class="internal">Grandmother never mentioned any of this. The secrets she kept...</span>

<span class="dialogue">"You have her fire."</span> Kael's voice drops lower. <span class="dialogue">"And her light. I sensed it the moment you arrived."</span>

Another howl, closer now. His body tenses against yours.

<span class="dialogue">"There will be time for stories. But first, we need to reach the cabin."</span>`,choices:[{text:"Promise to hear the full story later",nextScene:"journey_begin",romanceChange:15,hint:"💜💜"},{text:'"I\'m starting to feel like I was meant to come here."',nextScene:"journey_begin",romanceChange:20,hint:"💜💜💜"}]},
the_hunters:{location:"The Dark Woods",showCharacter:true,characterName:"Kael",text:`<span class="dialogue">"Rogues,"</span> Kael snarls as he pulls you through the trees. <span class="dialogue">"Shifters who've rejected pack law. They see the blood moon as a chance to take what they want without consequences."</span>

His eyes flash golden in the darkness.

<span class="dialogue">"And right now, they want you. New blood in their territory, carrying the scent of someone the old Alpha favored."</span>

<span class="dialogue">"Old Alpha?"</span>

<span class="dialogue">"My father. He and your grandmother..."</span> Kael's jaw tightens. <span class="dialogue">"It's complicated. But the rogues see you as a symbol. A way to hurt the pack."</span>

<span class="dialogue">"Stay close to me. No matter what you see."</span>`,choices:[{text:'"I won\'t leave your side."',nextScene:"journey_begin",romanceChange:15,hint:"💜💜"},{text:'"What exactly am I going to see?"',nextScene:"journey_begin",romanceChange:10,hint:"💜"}]},
journey_begin:{location:"Deep in Ravenshollow Forest",showCharacter:true,characterName:"Kael",text:`The forest seems alive around you—whispers in the wind, shadows that move when they shouldn't. But with Kael's hand in yours, you feel strangely safe.

Then he stops abruptly, nostrils flaring.

<span class="dialogue">"They've circled ahead."</span> His voice is barely a growl. <span class="dialogue">"We need to make a choice."</span>

He turns to face you fully, moonlight painting silver in his hair. For a moment, you see the weight of centuries in his eyes—the loneliness of being something other.

<span class="dialogue">"The cabin is through the clearing ahead. Fifty yards. But there are at least three rogues between us and safety."</span>

He takes both your hands in his.

<span class="dialogue">"I can shift—become the wolf—and fight them. Keep them busy while you run. Or..."</span>

His gaze drops to your lips, then back up.

<span class="dialogue">"Or I mark you. Temporarily. My scent on you would give them pause. Make them see you as pack, not prey."</span>`,choices:[{text:'"Shift. I trust you to protect us both."',nextScene:"wolf_fight",romanceChange:10,hint:"💜"},{text:'"Mark me. Whatever it takes."',nextScene:"the_mark",romanceChange:25,hint:"💜💜💜"},{text:'"I\'ll fight with you. I\'m not helpless."',nextScene:"fight_together",romanceChange:15,hint:"💜💜"}]},
wolf_fight:{location:"The Blood Moon Clearing",showCharacter:true,characterName:"Kael",text:`<span class="dialogue">"Stay behind me. And don't look away."</span>

Kael releases you and steps forward. The transformation begins.

It should be horrifying—bones cracking, reshaping, skin rippling like water. But instead, it's <span class="emphasis">beautiful</span>. Moonlight wraps around him like silk as he falls forward onto four massive paws.

The wolf that stands before you is enormous—shoulder-height with obsidian fur that seems to absorb the light. His eyes remain silver, fixed on yours, and somehow you know: <span class="emphasis">it's still him</span>.

He throws back his head and <span class="emphasis">howls</span>—a sound that shakes your bones and sets the night on fire.

Answering howls, angry and challenging. Three shapes burst from the trees. Kael meets them with fang and fury, moving like liquid shadow.

You can't look away. You shouldn't <span class="emphasis">want</span> to look away.

<span class="internal">He's magnificent.</span>`,choices:[{text:"Watch in awe as he defeats them",nextScene:"after_battle",romanceChange:15,hint:"💜💜"},{text:"Grab a branch—defend yourself if needed",nextScene:"after_battle",romanceChange:10,hint:"💜"}]},
the_mark:{location:"Beneath the Blood Moon",showCharacter:true,characterName:"Kael",text:`Kael's breath catches. He steps closer, close enough that you can feel heat radiating from his skin.

<span class="dialogue">"This will feel... intense,"</span> he warns, voice rough. <span class="dialogue">"My scent, my essence, bonding with yours. It's temporary, but—"</span>

<span class="dialogue">"I'm not afraid."</span>

His hands find your waist, drawing you against him. Your heart hammers as he lowers his face to your neck, his breath warm against your pulse point.

<span class="dialogue">"Brave one,"</span> he murmurs against your skin. <span class="dialogue">"My grandmother would have loved you."</span>

Then he presses his lips to your throat—not a kiss, something deeper. Something <span class="emphasis">ancient</span>. Energy floods through you like moonlight made liquid, and you gasp, fingers clutching his shoulders.

When he pulls back, his eyes are molten gold.

<span class="dialogue">"Now you are mine,"</span> he says softly. <span class="dialogue">"At least for tonight."</span>

<span class="internal">Why does 'tonight' feel like it won't be long enough?</span>`,choices:[{text:'"Maybe I don\'t want it to be temporary."',nextScene:"after_battle",romanceChange:30,hint:"💜💜💜💜"},{text:'Touch his face. "Thank you for protecting me."',nextScene:"after_battle",romanceChange:20,hint:"💜💜"}]},
fight_together:{location:"The Battle Clearing",showCharacter:true,characterName:"Kael",text:`<span class="dialogue">"Stubborn,"</span> Kael growls, but there's pride in his eyes. <span class="dialogue">"Very well. Stay at my back."</span>

He doesn't fully shift—instead, he becomes something between. Claws extend from his fingertips. His features sharpen, becoming wolfish while remaining human. It's terrifying. It's <span class="emphasis">exhilarating</span>.

The rogues emerge—snarling, half-transformed monstrosities. But you've found a sturdy branch, and when one lunges at your flank, you swing with everything you have.

It connects. The creature yelps.

<span class="dialogue">"Behind you!"</span> Kael roars, and you duck as he launches over your head, meeting the second rogue mid-air.

By the time the third flees into the darkness, you're both breathing hard. Kael's gaze finds yours, wild and approving.

<span class="dialogue">"I've never met anyone like you."</span>`,choices:[{text:'"Is that a good thing?"',nextScene:"after_battle",romanceChange:20,hint:"💜💜💜"},{text:'"We make a good team."',nextScene:"after_battle",romanceChange:15,hint:"💜💜"}]},
after_battle:{location:"Grandmother's Cabin",showCharacter:true,characterName:"Kael",text:`The cabin appears through the trees like a promise—stone walls, a wooden porch, smoke already rising from the chimney.

<span class="dialogue">"Magic,"</span> Kael explains, seeing your surprise. <span class="dialogue">"The cabin knows when someone of your bloodline is coming."</span>

Inside, it's warm and surprisingly cozy. Dried herbs hang from the rafters. Books line every wall. And on the mantle, there's a photo—your grandmother, young and beautiful, standing next to a man with familiar silver eyes.

<span class="dialogue">"My father,"</span> Kael says softly, following your gaze. <span class="dialogue">"They were... complicated. As these things often are."</span>

He turns to you, his half-shifted features smoothing back to human. In the firelight, he looks almost vulnerable.

<span class="dialogue">"You can stay here tonight. You'll be safe—the cabin is warded. I should go before..."</span>

He hesitates, conflict written across his features.`,choices:[{text:'"Stay. Please."',nextScene:"stay_together",romanceChange:25,hint:"💜💜💜"},{text:'"What happens at dawn?"',nextScene:"dawn_decision",romanceChange:10,hint:"💜"},{text:'"Thank you for everything. I understand if you need to leave."',nextScene:"letting_go",romanceChange:5}]},
stay_together:{location:"By the Fire",showCharacter:true,characterName:"Kael",text:`The word seems to freeze him. Then, slowly, he closes the door.

<span class="dialogue">"The blood moon affects my control,"</span> he warns, voice strained. <span class="dialogue">"I shouldn't be this close to you. Especially not after..."</span>

His gaze drops to your throat, where his mark still tingles with warmth.

<span class="dialogue">"I want to stay,"</span> he admits. <span class="dialogue">"More than I've wanted anything in centuries. That terrifies me."</span>

You step closer. Close enough to feel his breath, to see the flecks of gold in his silver eyes.

<span class="dialogue">"I came to Ravenshollow looking for answers about my family,"</span> you say softly. <span class="dialogue">"But I think... maybe I was looking for something else too."</span>

<span class="dialogue">"And what did you find?"</span>

<span class="internal">You found him.</span>`,choices:[{text:"Kiss him",nextScene:"romantic_ending_setup",romanceChange:30,hint:"💜💜💜💜"},{text:'"Stay until dawn. We can figure out the rest after."',nextScene:"tender_night",romanceChange:20,hint:"💜💜💜"}]},
dawn_decision:{location:"Grandmother's Cabin",showCharacter:true,characterName:"Kael",text:`<span class="dialogue">"At dawn, the blood moon's power fades."</span> Kael moves to the window, gazing out at the crimson-tinged sky. <span class="dialogue">"The rogues will retreat. My control will return."</span>

He looks back at you.

<span class="dialogue">"But you'll have to make a choice. Return to your life—pretend this was all a dream. The cabin will accept you regardless."</span>

<span class="dialogue">"Or?"</span>

<span class="dialogue">"Or embrace your grandmother's legacy. Learn the truth of what you are, what you could become. Stay in Ravenshollow."</span> His voice drops. <span class="dialogue">"Stay... with me."</span>

<span class="internal">One night. One impossible night. And now a decision that could change everything.</span>`,choices:[{text:'"I\'ve spent my whole life playing it safe. Not anymore."',nextScene:"romantic_ending_setup",romanceChange:25,hint:"💜💜💜"},{text:'"I need time to think... but I don\'t want you to leave yet."',nextScene:"tender_night",romanceChange:15,hint:"💜💜"}]},
letting_go:{location:"Grandmother's Cabin - Doorway",showCharacter:true,characterName:"Kael",text:`Something flickers in his eyes—disappointment? Or perhaps relief at not having to fight his nature.

<span class="dialogue">"You are kind,"</span> he says quietly. <span class="dialogue">"Like she was."</span>

He pauses at the door, hand on the frame.

<span class="dialogue">"The rogues won't bother you here. And at dawn... I'll return. We should talk. About your grandmother. About..."</span>

His gaze lingers on your face.

<span class="dialogue">"About possibilities."</span>

Then he's gone, melting into the moonlit forest like shadow.

You explore the cabin alone, finding journals, pressed flowers, and more questions than answers. Sleep comes eventually, restless and full of silver eyes.

<span class="internal">Dawn can't come soon enough.</span>`,choices:[{text:"Wait for dawn with hope in your heart",nextScene:"hopeful_ending_setup",romanceChange:5,hint:"💜"},{text:"Focus on exploring your grandmother's secrets",nextScene:"bittersweet_ending_setup",romanceChange:0}]},
tender_night:{location:"By the Fireside",showCharacter:true,characterName:"Kael",text:`Kael settles beside you on the rug before the fire. Close, but not touching. Respecting your pace.

The hours pass in conversation—stories of your grandmother, of the pack, of the ancient magic that runs through Ravenshollow. He tells you of his centuries of solitude, of the weight of leadership, of never expecting to feel this way about anyone.

<span class="dialogue">"She told me once,"</span> Kael says, voice soft, <span class="dialogue">"that her granddaughter would change everything. I didn't believe her."</span>

<span class="dialogue">"And now?"</span>

He reaches out, tucking a strand of hair behind your ear. His touch is impossibly gentle for someone so dangerous.

<span class="dialogue">"Now I believe in a lot of things I didn't before."</span>

<span class="internal">This feels like the beginning of something extraordinary.</span>`,choices:[{text:'"I want to stay. In Ravenshollow. With you."',nextScene:"romantic_ending_setup",romanceChange:25,hint:"💜💜💜"},{text:'"Will you teach me about my grandmother\'s world?"',nextScene:"hopeful_ending_setup",romanceChange:15,hint:"💜💜"}]},
romantic_ending_setup:{location:"Grandmother's Cabin - Dawn",showCharacter:true,characterName:"Kael",text:`The kiss—or the choice—changes everything.

Kael's arms wrap around you like coming home. His lips are soft, urgent, tasting of moonlight and promises. The mark on your throat pulses with warmth, and you feel something <span class="emphasis">click</span> into place. A bond. Ancient and unbreakable.

<span class="dialogue">"This is forever,"</span> he breathes against your lips. <span class="dialogue">"What you're agreeing to—a life here, with me, with my pack—it's not simple. It won't be easy."</span>

<span class="dialogue">"I don't want easy."</span> You pull back just enough to meet his golden eyes. <span class="dialogue">"I want this. I want you."</span>

<span class="dialogue">"Then you have me."</span> His forehead rests against yours. <span class="dialogue">"All of me. Always."</span>

The sun breaks over the mountains, golden light flooding the cabin. The blood moon is gone, but its magic lingers in your veins, in the bond between you.

Your grandmother's voice seems to whisper on the wind: <span class="emphasis">I knew you'd find your way home.</span>`,choices:[{text:"Embrace your new life as the Alpha's mate",nextScene:"ending_romantic",romanceChange:10}]},
hopeful_ending_setup:{location:"Grandmother's Cabin - Dawn",showCharacter:true,characterName:"Kael",text:`Dawn light streams through the windows as Kael returns. He looks different in daylight—softer, more human. But his eyes still hold that otherworldly silver gleam when he looks at you.

<span class="dialogue">"You stayed,"</span> he says, and there's wonder in his voice.

<span class="dialogue">"I have a lot of questions."</span>

<span class="dialogue">"And I have a lot of answers."</span> He steps inside, careful, hopeful. <span class="dialogue">"If you'll have them."</span>

The space between you crackles with possibility. Not love yet—maybe—but something that could become it. Something worth exploring.

<span class="dialogue">"Teach me,"</span> you say. <span class="dialogue">"About the supernatural world. About my grandmother's gifts. About..."</span>

<span class="dialogue">"About us?"</span> He offers his hand, palm up. An invitation.

<span class="internal">This time, you don't hesitate to take it.</span>`,choices:[{text:"Begin your journey of discovery together",nextScene:"ending_hopeful",romanceChange:10}]},
bittersweet_ending_setup:{location:"Grandmother's Cabin - Morning",showCharacter:true,characterName:"Kael",text:`The journals consume you through the night. Your grandmother's handwriting reveals a life of secrets—of magic, of love, of sacrifice.

When dawn comes, you understand why she left Ravenshollow. Some bonds are too dangerous to keep.

Kael appears at the window, still in wolf form. He watches you through the glass, silver eyes sorrowful and knowing.

<span class="internal">He felt it too, didn't he? The pull between us. The impossibility of it.</span>

Slowly, he bows his great head—a gesture of respect, of farewell—and turns back toward the forest.

<span class="dialogue">"Wait,"</span> you whisper, though you know he can't hear you.

Or maybe he can, because he pauses at the tree line and looks back. One long, aching moment. A promise of what could have been.

Then he's gone.

<span class="internal">You have the cabin. You have answers. But somehow, you've never felt more alone.</span>`,choices:[{text:"Perhaps someday, you'll be brave enough to call him back",nextScene:"ending_bittersweet",romanceChange:0}]},
ending_romantic:{ending:true,type:"romantic",title:"Bound by Blood and Moonlight",icon:"🌹",text:`<p>You chose love. You chose the wild, the unknown, the terrifying beauty of a world beyond human understanding.</p><p>Months later, you stand on the porch of your grandmother's cabin—now <em>your</em> cabin—watching the moon rise. Kael's arms wrap around you from behind, his warmth a constant comfort.</p><p>"The pack has accepted you," he murmurs against your hair. "They adore you, actually."</p><p>"Is that why Lila keeps challenging me to arm wrestling?"</p><p>His laugh rumbles through you. "That's respect, my love."</p><p>You turn in his arms, rising on tiptoe to kiss him. The bond between you pulses—eternal, unbreakable.</p><p>"No regrets?" he asks, as he always does.</p><p>"Not a single one."</p><p>Above you, the blood moon rises again. But this time, you're not running from its magic.</p><p>You're running <em>with</em> it.</p><p><strong>~ The Beginning of Forever ~</strong></p>`},
ending_hopeful:{ending:true,type:"hopeful",title:"A New Chapter Begins",icon:"✨",text:`<p>You chose discovery. You chose to understand before you committed, to learn who you could become.</p><p>The weeks that follow are a revelation. Kael teaches you about the pack, the old magic, the gifts sleeping in your blood. Your grandmother's journals become a treasure map to a world you never knew existed.</p><p>And somewhere along the way, between lessons and laughter and lingering glances, something deeper begins to grow.</p><p>"You're not what I expected," Kael admits one evening, watching you successfully ward your first protective circle.</p><p>"What did you expect?"</p><p>"Someone who would run." His eyes meet yours, warm with something that makes your heart skip. "Not someone who would stay and fight."</p><p>"Maybe I'm exactly where I'm supposed to be."</p><p>He smiles—that rare, devastating smile—and for the first time, you let yourself imagine a future in Ravenshollow.</p><p>A future with him.</p><p><strong>~ To Be Continued ~</strong></p>`},
ending_bittersweet:{ending:true,type:"bittersweet",title:"What Might Have Been",icon:"🌙",text:`<p>You chose safety. Protection. The familiar ache of loneliness over the terrifying unknown of love.</p><p>The cabin becomes your home. You learn your grandmother's magic, tend her garden, make friends with the townspeople who whisper about the old woman's heir. It's a good life.</p><p>But some nights, when the moon is full and the wolves howl in the distance, you stand at the window and wonder.</p><p>Kael keeps his distance, as you silently asked him to. But sometimes you see him—a shadow at the tree line, silver eyes watching. Waiting.</p><p>You found your grandmother's legacy. You found power, purpose, a place to belong.</p><p>But late at night, in the quiet hours before dawn, you can't help wondering what else you might have found... if you'd only been brave enough to reach for it.</p><p><em>Perhaps someday, you will be.</em></p><p><strong>~ Until the Next Blood Moon ~</strong></p>`}

stopAmbience(){if(this.currentAmbience){this.currentAmbience.oscillator.stop();this.currentAmbience=null}}
playNotificationSound(){if(!this.audioContext||!this.state.soundEnabled)return;const o=this.audioContext.createOscillator();const g=this.audioContext.createGain();o.type='sine';o.frequency.value=523.25;g.gain.value=0.1;g.gain.exponentialRampToValueAtTime(0.01,this.audioContext.currentTime+0.3);o.connect(g);g.connect(this.audioContext.destination);o.start();o.stop(this.audioContext.currentTime+0.3)}
createParticles(){const c=this.elements.particles;for(let i=0;i<15;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*8+'s';p.style.animationDuration=(6+Math.random()*4)+'s';c.appendChild(p)}}
showScreen(n){Object.values(this.screens).forEach(s=>s.classList.remove('active'));this.screens[n].classList.add('active')}
startNewGame(){this.state={...GameState,soundEnabled:this.state.soundEnabled};this.showScreen('game');this.loadScene('intro');if(this.state.soundEnabled)this.playAmbience()}
loadScene(id){const scene=StoryContent[id];if(!scene)return;this.state.currentScene=id;if(scene.ending){this.showEnding(scene);return}this.elements.locationBadge.textContent=scene.location;if(scene.showCharacter){this.elements.characterPortrait.classList.remove('hidden');this.elements.characterNameBadge.textContent=scene.characterName||''}else{this.elements.characterPortrait.classList.add('hidden')}this.elements.storyText.style.opacity='0';this.elements.storyText.innerHTML=scene.text;this.elements.choicesArea.innerHTML='';let op=0;const fi=setInterval(()=>{op+=0.05;this.elements.storyText.style.opacity=op;if(op>=1){clearInterval(fi);setTimeout(()=>this.showChoices(scene.choices),300)}},20)}
showChoices(choices){if(!choices)return;this.elements.choicesArea.innerHTML='';choices.forEach((c,i)=>{const b=document.createElement('button');b.className='choice-btn';b.innerHTML=`${c.text}${c.hint?`<span class="romance-hint">${c.hint}</span>`:''}`;b.style.opacity='0';b.style.transform='translateX(-20px)';setTimeout(()=>{b.style.transition='all 0.4s ease';b.style.opacity='1';b.style.transform='translateX(0)'},i*100);b.addEventListener('click',()=>this.makeChoice(c));this.elements.choicesArea.appendChild(b)})}
makeChoice(c){this.state.choicesMade.push({scene:this.state.currentScene,choice:c.text});if(c.romanceChange)this.updateRomance(c.romanceChange);this.playNotificationSound();this.loadScene(c.nextScene);this.autoSave()}
updateRomance(change){this.state.romancePoints=Math.max(0,Math.min(100,this.state.romancePoints+change));const pct=(this.state.romancePoints/100)*100;this.elements.romanceFill.style.width=pct+'%';this.elements.romanceValue.textContent=this.state.romancePoints;if(change>0)this.showNotification(`💜 +${change} Romance`)}
showNotification(text){this.elements.notificationText.textContent=text;this.elements.notification.classList.remove('hidden');setTimeout(()=>this.elements.notification.classList.add('hidden'),2000)}
showEnding(scene){this.showScreen('ending');this.stopAmbience();this.elements.endingIcon.textContent=scene.icon;this.elements.endingTitle.textContent=scene.title;this.elements.endingText.innerHTML=scene.text;this.elements.finalRomance.textContent=`${this.state.romancePoints}/100`;this.elements.finalChoices.textContent=this.state.choicesMade.length;localStorage.removeItem('bloodMoonSave');this.elements.continueBtn.style.display='none'}
shareEnding(){const t=`I just finished Blood Moon Shifters with ${this.state.romancePoints} romance points! 🌙💜`;if(navigator.share)navigator.share({title:'Blood Moon Shifters',text:t,url:window.location.href});else navigator.clipboard.writeText(t).then(()=>alert('Copied to clipboard!'))}
saveGame(){localStorage.setItem('bloodMoonSave',JSON.stringify({...this.state,timestamp:new Date().toISOString()}));this.elements.saveNotification.classList.remove('hidden');setTimeout(()=>this.elements.saveNotification.classList.add('hidden'),2000);this.playNotificationSound()}
autoSave(){localStorage.setItem('bloodMoonAutoSave',JSON.stringify({...this.state,timestamp:new Date().toISOString()}))}
loadGame(){const d=localStorage.getItem('bloodMoonSave')||localStorage.getItem('bloodMoonAutoSave');if(!d){alert('No saved game found!');return}try{const p=JSON.parse(d);this.state={...GameState,...p,soundEnabled:this.state.soundEnabled};this.showScreen('game');this.loadScene(this.state.currentScene);this.updateRomance(0);if(this.state.soundEnabled)this.playAmbience()}catch(e){alert('Failed to load saved game.')}}
checkSavedGame(){if(localStorage.getItem('bloodMoonSave')||localStorage.getItem('bloodMoonAutoSave'))this.elements.continueBtn.style.display='block'}
togglePauseMenu(){if(this.screens.game.classList.contains('active'))this.elements.pauseMenu.classList.toggle('hidden')}
quitToTitle(){this.togglePauseMenu();this.stopAmbience();this.showScreen('title');this.checkSavedGame()}
}
document.addEventListener('DOMContentLoaded',()=>{window.game=new BloodMoonGame()});
</script>
